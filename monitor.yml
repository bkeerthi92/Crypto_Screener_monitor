# GitHub Actions workflow: runs the REAL continuous monitor loop as ONE job,
# not periodic short checks. Start it whenever you want to watch a position
# or hunt for a setup; it keeps looping and printing live to this log for up
# to 5.5 hours (safely under GitHub's hard 6-hour job kill), sending a
# Telegram alert only on a real stop-loss/danger/target event or a
# HIGH-confidence actionable setup (deduped so it won't spam repeats).
#
# SETUP: put this file at .github/workflows/monitor.yml in your repo.
#
# HOW TO START A SESSION:
#   Repo -> Actions tab -> "Crypto Signal Monitor (long session)" -> Run workflow
#   (optionally override the symbol / max hours in the inputs box)
#
# HONEST LIMITS:
# - GitHub kills ANY job at 6h no matter what - this stops itself at 5.5h to
#   exit cleanly first. Re-run the workflow for another session.
# - This does NOT auto-restart itself. If you want it to always be running,
#   add a `schedule:` trigger below that fires every 5.5h to chain sessions -
#   commented out by default since you said you'd start it yourself.
# - Public repos run free; private repos consume your monthly Actions minutes.

name: Crypto Signal Monitor (long session)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol to monitor (uses position.json's symbol if left blank)"
        required: false
        default: ""
      max_hours:
        description: "Max session length in hours (keep under 6)"
        required: false
        default: "5.5"
  # Uncomment below to auto-start a new 5.5h session right after each one ends,
  # for something closer to "always on" (still not a true infinite process -
  # each run is a fresh session, state persists via position.json):
  # schedule:
  #   - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # 5h55m - a safety margin above --max-hours 5.5 below

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run continuous monitor session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SYMBOL_ARG=""
          if [ -n "${{ github.event.inputs.symbol }}" ]; then
            SYMBOL_ARG="${{ github.event.inputs.symbol }}"
          fi
          python crypto_signal_bot.py $SYMBOL_ARG --ci-monitor \
            --position-file position.json \
            --max-hours "${{ github.event.inputs.max_hours || '5.5' }}" \
            --no-news
